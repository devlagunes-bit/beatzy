<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Aventura Saludable con Beatzy</title>
<meta name="description" content="¿Y si aprender de hábitos saludables se convirtiera en la aventura favorita de los niños? Síguenos en todas nuestras redes.">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    background: linear-gradient(170deg, #ffd93b 0%, #ffe680 45%, #fff7d1 100%);
    display: flex; justify-content: center; align-items: flex-start;
    padding: 48px 20px;
    color: #23402a;
  }
  .card { width: 100%; max-width: 420px; text-align: center; }
  .logo {
    width: 190px; height: 190px; margin: 0 auto 18px;
    border-radius: 28px; object-fit: cover; display: block;
    border: 5px solid #fff;
    box-shadow: 0 8px 20px rgba(0,0,0,.15);
  }
  h1 { font-size: 1.6rem; line-height: 1.2; margin-bottom: 8px; color: #2d2a6e; }
  p.sub { font-size: 1rem; margin-bottom: 30px; color: #3c5a44; }
  a.btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 16px 18px; margin-bottom: 14px;
    border-radius: 18px;
    font-size: 1.1rem; font-weight: 700; text-decoration: none; color: #fff;
    transition: transform .15s ease;
  }
  a.btn:active { transform: translateY(3px); }
  .yt { background: #e63946; box-shadow: 0 5px 0 #b02a35; }
  .ig { background: #c13584; box-shadow: 0 5px 0 #8f2662; }
  .tt { background: #222;    box-shadow: 0 5px 0 #000; }
  .fb { background: #1877f2; box-shadow: 0 5px 0 #0f5bc0; }
  .ico { width: 26px; height: 26px; flex-shrink: 0; }
  footer { margin-top: 28px; font-size: .85rem; color: #5b7a63; }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="logo.jpg" alt="La aventura saludable empieza con Beatzy">
    <h1>La Aventura Saludable<br>con Beatzy</h1>
    <p class="sub">Hábitos saludables convertidos en la aventura favorita de los niños 🍎</p>

    <a class="btn yt" href="https://www.youtube.com/@Beatzyaventurasaludable" target="_blank" rel="noopener"><img class="ico" src="icons/youtube.svg" alt="" width="26" height="26"> YouTube</a>
    <a class="btn ig" href="https://www.instagram.com/laaventurasaludableconbeatzy" target="_blank" rel="noopener"><img class="ico" src="icons/instagram.svg" alt="" width="26" height="26"> Instagram</a>
    <a class="btn tt" href="https://www.tiktok.com/@laaventuraconbeatzy" target="_blank" rel="noopener"><img class="ico" src="icons/tiktok.svg" alt="" width="26" height="26"> TikTok</a>
    <a class="btn fb" href="https://www.facebook.com/share/1KCHHPQT1n/" target="_blank" rel="noopener"><img class="ico" src="icons/facebook.svg" alt="" width="26" height="26"> Facebook</a>

    <footer>¡Síguenos en todas nuestras redes!</footer>
  </main>
</body>
</html>
